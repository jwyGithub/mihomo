services:
    mihomo:
        image: ghcr.io/jwygithub/mihomo:latest
        container_name: mihomo
        restart: unless-stopped
        environment:
            # 时区，影响 cron 定时更新的触发时间
            - TZ=Asia/Shanghai
            # GeoIP/GeoSite 数据库定时更新（可选，不设置则保持纯离线、仅用镜像内置库）
            # 每周日 5:00 更新一次：
            - GEO_UPDATE_CRON=0 5 * * 0
            # 每月 1 号 5:00 更新一次（二选一）：
            # - GEO_UPDATE_CRON=0 5 1 * *
            # 可选：自定义下载源（CN 环境可改用镜像/CDN 加速）
            # - GEO_BASE=https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release
            # external-controller / 面板 API 的访问密钥（对所有实例生效；
            # 也可在 subs.yaml 为单个 sub 单独设置 secret 覆盖此值）
            # - CONTROLLER_SECRET=change-me-please
            # DNS/fake-ip 默认模板：off(默认) 完全沿用订阅自带 DNS；on 注入离线 fake-ip DNS 模板
            # - DNS_TEMPLATE=on
            # 极端情况下 mihomo -t 误报时可临时跳过「应用前配置校验」（不建议长期开启）
            # - SKIP_CONFIG_TEST=1
        volumes:
            # 配置文件（每个 sub 的自定义 override 直接内联在 subs.yaml 的 override: 块里）
            - ./subs.yaml:/data/subs.yaml
            # 可选：持久化各实例运行目录（含 geo 缓存 + 节点选择/fake-ip 持久化状态）
            # - ./data/run:/data/run
            # 可选：持久化日志（每个 sub 独立日志文件）
            # - ./data/logs:/data/logs
        ports:
            # 端口规则：每个 sub 占用 port / port+1(socks) / port+2(controller)
            # sub-jawyn (port=7290)
            - '7290:7290' # http
            - '7291:7291' # socks（按需）
            # - '7292:7292' # external-controller / 面板 API（按需）
            # sub-public (port=7390)
            - '7390:7390' # http
            - '7391:7391' # socks（按需）
            # - '7392:7392' # external-controller / 面板 API（按需）
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
