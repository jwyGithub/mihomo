# 默认 DNS / Fake-IP 模板（feature 7）
# 作为「基底」合并进订阅：合并优先级 模板 < 订阅 < override，
# 即模板仅补齐订阅缺失的 DNS 项，订阅自带的 dns 始终优先。
# 关闭：设置环境变量 DNS_TEMPLATE=off
# 自定义：直接修改本文件，或挂载/指向其它路径（DNS_TEMPLATE_FILE）
dns:
    enable: true
    ipv6: false
    listen: ''
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    use-hosts: true
    fake-ip-filter:
        - '*.lan'
        - '*.local'
        - '*.arpa'
        - time.*.com
        - ntp.*.com
        - +.market.xiaomi.com
        - localhost.ptlogin2.qq.com
        - '*.msftncsi.com'
        - www.msftconnecttest.com
    default-nameserver:
        - 119.29.29.29
        - 223.5.5.5
    nameserver:
        - 119.29.29.29
        - 223.5.5.5
        - https://ip.looby.dpdns.org/dns-query
    nameserver-policy:
        geosite:cn:
            - 119.29.29.29
            - 223.5.5.5
        geosite:geolocation-!cn:
            - tls://1.0.0.1:853
            - tls://dns.google:853
    proxy-server-nameserver:
        - 119.29.29.29
        - 223.5.5.5
        - https://ip.looby.dpdns.org/dns-query
    fallback:
        - 8.8.8.8
        - 1.1.1.1
        - tls://1.0.0.1:853
        - tls://dns.google:853
        - https://ip.looby.dpdns.org/dns-query
    fallback-filter:
        geoip: true
        geoip-code: CN
        geosite:
            - gfw
        ipcidr:
            - 240.0.0.0/4

